syntax = "proto3";

package plugin;

// PluginService provides plugin execution capabilities
service PluginService {
    // ExecutePlugin processes a plugin request and returns the result
    rpc ExecutePlugin (PluginRequest) returns (PluginResponse);
}

// PluginRequest contains the data needed to execute a plugin
message PluginRequest {
    string plugin_name = 1;
    string plugin_data = 2;
    map<string, string> parameters = 3;
}

// PluginResponse contains the result of plugin execution
message PluginResponse {
    string result = 1;
    bool success = 2;
    string error_message = 3;
}
